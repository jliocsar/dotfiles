# Zenbones Dark — hunk palette, appended to config.toml by the `theme` command.
# Every value is a zenbones.nvim token or a spec-derived shade (Normal, CursorLine,
# NormalFloat, Visual, Folded, LineNr, StatusLine, DiffAdd/Delete/Change/Text).
[custom_theme]
base = "midnight"
label = "Zenbones Dark"
background = "#1c1917"
text = "#b4bdc3"
muted = "#685f5a"
panel = "#25211f"
panelAlt = "#302b29"
border = "#403833"
accent = "#afa099"
accentMuted = "#685f5a"
addedBg = "#232d1a"
removedBg = "#3e2225"
movedAddedBg = "#1d2c36"
movedRemovedBg = "#3f1e39"
contextBg = "#1c1917"
addedContentBg = "#3b492d"
removedContentBg = "#62393d"
contextContentBg = "#25211f"
addedSignColor = "#819b69"
removedSignColor = "#de6e7c"
lineNumberBg = "#1c1917"
lineNumberFg = "#685f5a"
selectedHunk = "#3d4042"
badgeAdded = "#819b69"
badgeRemoved = "#de6e7c"
badgeNeutral = "#888f94"
fileNew = "#819b69"
fileDeleted = "#de6e7c"
fileRenamed = "#6099c0"
fileModified = "#b77e64"
fileUntracked = "#888f94"
noteBorder = "#b279a7"
noteBackground = "#302b29"
noteTitleBackground = "#352f2d"
noteTitleText = "#b4bdc3"

[custom_theme.syntax]
default = "#b4bdc3"
keyword = "#b4bdc3"
string = "#868c91"
comment = "#6e6763"
number = "#868c91"
function = "#b4bdc3"
property = "#979fa4"
type = "#a1938c"
variable = "#979fa4"
operator = "#b4bdc3"
punctuation = "#867a74"
