# Delta One Dark — hunk palette, appended to config.toml by the `theme` command.
# Every value is a token from Delta's bundled `Delta One Dark` theme: editor.bg,
# panel.bg, surface.bg, border, text/text.muted, editor.line_number,
# editor.diff_hunk.*, version_control.*, the blue_orange diff scheme for moves.
[custom_theme]
base = "one-dark-pro"
label = "Delta One Dark"
background = "#191c1f"
text = "#acb2be"
muted = "#878a98"
panel = "#202327"
panelAlt = "#22252a"
border = "#32363e"
accent = "#74ade8"
accentMuted = "#47679e"
addedBg = "#1f2e25"
removedBg = "#381e23"
movedAddedBg = "#182a40"
movedRemovedBg = "#3f2a14"
contextBg = "#191c1f"
addedContentBg = "#274736"
removedContentBg = "#44292e"
contextContentBg = "#202327"
addedSignColor = "#98c379"
removedSignColor = "#e06c75"
lineNumberBg = "#191c1f"
lineNumberFg = "#4e5a5f"
selectedHunk = "#2c2f35"
badgeAdded = "#a1c181"
badgeRemoved = "#d07277"
badgeNeutral = "#878a98"
fileNew = "#a1c181"
fileDeleted = "#d07277"
fileRenamed = "#74ade8"
fileModified = "#dec184"
fileUntracked = "#878a98"
noteBorder = "#b477cf"
noteBackground = "#22252a"
noteTitleBackground = "#272a2f"
noteTitleText = "#dce0e5"

# TextMate scopes mapped from the theme's `syntax` block.
[custom_theme.syntax_scopes]
"comment" = "#5d636f"
"punctuation.definition.comment" = "#5d636f"
"comment.block.documentation" = "#878e98"
"string" = "#a1c181"
"constant.character.escape" = "#878e98"
"string.regexp" = "#bf956a"
"constant.numeric" = "#bf956a"
"constant.language" = "#bf956a"
"constant" = "#dfc184"
"keyword" = "#b477cf"
"storage" = "#b477cf"
"storage.type" = "#b477cf"
"keyword.control" = "#b477cf"
"keyword.operator" = "#6eb4bf"
"entity.name.function" = "#73ade9"
"support.function" = "#73ade9"
"entity.name.type" = "#6eb4bf"
"support.type" = "#6eb4bf"
"support.class" = "#6eb4bf"
"entity.name.tag" = "#74ade8"
"entity.other.attribute-name" = "#74ade8"
"variable" = "#acb2be"
"variable.other.property" = "#d07277"
"variable.other.object.property" = "#d07277"
"support.type.property-name" = "#d07277"
"meta.object-literal.key" = "#d07277"
"punctuation" = "#b2b9c6"
"markup.heading" = "#d07277"
"markup.bold" = "#bf956a"
"markup.italic" = "#74ade8"
"markup.inline.raw" = "#a1c181"
