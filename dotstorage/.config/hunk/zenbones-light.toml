# Zenbones Light — hunk palette, appended to config.toml by the `theme` command.
# Mirrors zenbones-dark.toml token for token, resolved against the light spec.
[custom_theme]
base = "paper"
label = "Zenbones Light"
background = "#f0edec"
text = "#2c363c"
muted = "#a4968f"
panel = "#e9e4e2"
panelAlt = "#ddd6d3"
border = "#cfc1ba"
accent = "#564e4a"
accentMuted = "#a4968f"
addedBg = "#cbe5b8"
removedBg = "#ebd8da"
movedAddedBg = "#d4dee7"
movedRemovedBg = "#e7d9e4"
contextBg = "#f0edec"
addedContentBg = "#acc29c"
removedContentBg = "#dab1b6"
contextContentBg = "#e9e4e2"
addedSignColor = "#4f6c31"
removedSignColor = "#a8334c"
lineNumberBg = "#f0edec"
lineNumberFg = "#a4968f"
selectedHunk = "#cbd9e3"
badgeAdded = "#4f6c31"
badgeRemoved = "#a8334c"
badgeNeutral = "#4f5e68"
fileNew = "#4f6c31"
fileDeleted = "#a8334c"
fileRenamed = "#286486"
fileModified = "#944927"
fileUntracked = "#4f5e68"
noteBorder = "#88507d"
noteBackground = "#ddd6d3"
noteTitleBackground = "#d6cdc9"
noteTitleText = "#2c363c"

[custom_theme.syntax]
default = "#2c363c"
keyword = "#2c363c"
string = "#556570"
comment = "#948985"
number = "#556570"
function = "#2c363c"
property = "#44525b"
type = "#6a5549"
variable = "#44525b"
operator = "#2c363c"
punctuation = "#8e817b"
