# Delta One Light — hunk palette, appended to config.toml by the `theme` command.
# Mirrors delta-one-dark.toml token for token, from Delta's `Delta One Light`.
[custom_theme]
base = "one-light"
label = "Delta One Light"
background = "#fafafa"
text = "#242529"
muted = "#7e8086"
panel = "#ebebec"
panelAlt = "#dfdfe0"
border = "#c9c9ca"
accent = "#5c78e2"
accentMuted = "#7d82e8"
addedBg = "#cde4d6"
removedBg = "#e6d1d5"
movedAddedBg = "#cbdff6"
movedRemovedBg = "#f4e0c2"
contextBg = "#fafafa"
addedContentBg = "#85d6a3"
removedContentBg = "#efa4b2"
contextContentBg = "#ebebec"
addedSignColor = "#3f953a"
removedSignColor = "#de3e35"
lineNumberBg = "#fafafa"
lineNumberFg = "#b4b4bb"
selectedHunk = "#dadbdd"
badgeAdded = "#669f59"
badgeRemoved = "#d36151"
badgeNeutral = "#7e8086"
fileNew = "#669f59"
fileDeleted = "#d36151"
fileRenamed = "#5c78e2"
fileModified = "#a48819"
fileUntracked = "#7e8086"
noteBorder = "#a449ab"
noteBackground = "#ebebec"
noteTitleBackground = "#dfdfe0"
noteTitleText = "#242529"

[custom_theme.syntax_scopes]
"comment" = "#a2a3a7"
"punctuation.definition.comment" = "#a2a3a7"
"comment.block.documentation" = "#7c7e86"
"string" = "#649f57"
"constant.character.escape" = "#7c7e86"
"string.regexp" = "#ad6e26"
"constant.numeric" = "#ad6e25"
"constant.language" = "#ad6e25"
"constant" = "#c18401"
"keyword" = "#a449ab"
"storage" = "#a449ab"
"storage.type" = "#a449ab"
"keyword.control" = "#a449ab"
"keyword.operator" = "#3882b7"
"entity.name.function" = "#5b79e3"
"support.function" = "#5b79e3"
"entity.name.type" = "#3882b7"
"support.type" = "#3882b7"
"support.class" = "#3882b7"
"entity.name.tag" = "#5c78e2"
"entity.other.attribute-name" = "#5c78e2"
"variable" = "#242529"
"variable.other.property" = "#d3604f"
"variable.other.object.property" = "#d3604f"
"support.type.property-name" = "#d3604f"
"meta.object-literal.key" = "#d3604f"
"punctuation" = "#4d4f52"
"markup.heading" = "#d3604f"
"markup.bold" = "#ad6e25"
"markup.italic" = "#5c78e2"
"markup.inline.raw" = "#649f57"
