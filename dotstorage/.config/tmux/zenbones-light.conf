# Zenbones Light — tmux palette (sourced by the `theme` command)
# Tokens from zenbones.nvim: bg #f0edec, fg #2c363c, bg1 #cfc1ba, fg1 #4f5e68,
# selection #cbd9e3, LineNr #a4968f, rose #a8334c, wood #944927, sky #3b8992.

setw -g clock-mode-colour '#944927'
setw -g mode-style 'fg=#f0edec bg=#a8334c bold'
setw -g copy-mode-match-style 'fg=#f0edec bg=#3b8992'
setw -g copy-mode-current-match-style 'fg=#f0edec bg=#944927 bold'

set -g pane-border-style 'fg=#cfc1ba'
set -g pane-active-border-style 'fg=#944927'
set -g display-panes-colour '#a4968f'
set -g display-panes-active-colour '#944927'
set-hook -g -w pane-focus-in "set-option -Fw pane-border-status '#{?#{e|>:#{window_panes},1},top,off}' \; select-pane -P 'active-border-style=fg=#944927,bg=default'"

set -g status-style 'fg=#2c363c bg=default'
setw -g window-status-style 'fg=#4f5e68 bg=default'
setw -g window-status-current-style 'fg=#2c363c bg=default'
setw -g window-status-activity-style 'fg=#286486 bg=default'
setw -g window-status-bell-style 'fg=#944927 bg=#f0edec bold'

set -g message-style 'fg=#944927 bg=#f0edec bold'
set -g message-command-style 'fg=#3b8992 bg=#f0edec bold'
