# One Light — tmux palette (sourced by the `theme` command)
# Tokens from the Zed `one` theme: bg #fafafa, fg #2a2c33, border #dfdfe0,
# muted #7e8086, line-number #b4b4bb, red #de3e35, orange #ad6e25,
# cyan #0997b3, blue #2f5af3.

setw -g clock-mode-colour '#ad6e25'
setw -g mode-style 'fg=#fafafa bg=#de3e35 bold'
setw -g copy-mode-match-style 'fg=#fafafa bg=#0997b3'
setw -g copy-mode-current-match-style 'fg=#fafafa bg=#ad6e25 bold'

set -g pane-border-style 'fg=#dfdfe0'
set -g pane-active-border-style 'fg=#ad6e25'
set -g display-panes-colour '#b4b4bb'
set -g display-panes-active-colour '#ad6e25'
set-hook -g -w pane-focus-in "set-option -Fw pane-border-status '#{?#{e|>:#{window_panes},1},top,off}' \; select-pane -P 'active-border-style=fg=#ad6e25,bg=default'"

set -g status-style 'fg=#2a2c33 bg=default'
setw -g window-status-style 'fg=#7e8086 bg=default'
setw -g window-status-current-style 'fg=#2a2c33 bg=default'
setw -g window-status-activity-style 'fg=#2f5af3 bg=default'
setw -g window-status-bell-style 'fg=#ad6e25 bg=#fafafa bold'

set -g message-style 'fg=#ad6e25 bg=#fafafa bold'
set -g message-command-style 'fg=#0997b3 bg=#fafafa bold'
