# Zenbones Dark — tmux palette (sourced by the `theme` command)
# Tokens from zenbones.nvim: bg #1c1917, fg #b4bdc3, bg1 #403833, fg1 #888f94,
# selection #3d4042, LineNr #685f5a, rose #de6e7c, wood #b77e64, sky #66a5ad.

setw -g clock-mode-colour '#b77e64'
setw -g mode-style 'fg=#1c1917 bg=#de6e7c bold'
setw -g copy-mode-match-style 'fg=#1c1917 bg=#66a5ad'
setw -g copy-mode-current-match-style 'fg=#1c1917 bg=#b77e64 bold'

set -g pane-border-style 'fg=#403833'
set -g pane-active-border-style 'fg=#b77e64'
set -g display-panes-colour '#685f5a'
set -g display-panes-active-colour '#b77e64'
set-hook -g -w pane-focus-in "set-option -Fw pane-border-status '#{?#{e|>:#{window_panes},1},top,off}' \; select-pane -P 'active-border-style=fg=#b77e64,bg=default'"

set -g status-style 'fg=#b4bdc3 bg=default'
setw -g window-status-style 'fg=#888f94 bg=default'
setw -g window-status-current-style 'fg=#b4bdc3 bg=default'
setw -g window-status-activity-style 'fg=#6099c0 bg=default'
setw -g window-status-bell-style 'fg=#b77e64 bg=#1c1917 bold'

set -g message-style 'fg=#b77e64 bg=#1c1917 bold'
set -g message-command-style 'fg=#66a5ad bg=#1c1917 bold'
