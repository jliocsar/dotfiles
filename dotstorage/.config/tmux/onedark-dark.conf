# One Dark — tmux palette (sourced by the `theme` command)
# Tokens from the Zed `one` theme: bg #282c34, fg #abb2bf, border #363c46,
# muted #878a98, line-number #4e5a5f, red #e06c75, orange #bf956a,
# cyan #56b6c2, blue #61afef.

setw -g clock-mode-colour '#bf956a'
setw -g mode-style 'fg=#282c34 bg=#e06c75 bold'
setw -g copy-mode-match-style 'fg=#282c34 bg=#56b6c2'
setw -g copy-mode-current-match-style 'fg=#282c34 bg=#bf956a bold'

set -g pane-border-style 'fg=#363c46'
set -g pane-active-border-style 'fg=#bf956a'
set -g display-panes-colour '#4e5a5f'
set -g display-panes-active-colour '#bf956a'
set-hook -g -w pane-focus-in "set-option -Fw pane-border-status '#{?#{e|>:#{window_panes},1},top,off}' \; select-pane -P 'active-border-style=fg=#bf956a,bg=default'"

set -g status-style 'fg=#abb2bf bg=default'
setw -g window-status-style 'fg=#878a98 bg=default'
setw -g window-status-current-style 'fg=#abb2bf bg=default'
setw -g window-status-activity-style 'fg=#61afef bg=default'
setw -g window-status-bell-style 'fg=#bf956a bg=#282c34 bold'

set -g message-style 'fg=#bf956a bg=#282c34 bold'
set -g message-command-style 'fg=#56b6c2 bg=#282c34 bold'
