<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Qt has no per-widget font list, so give SF Pro the nerd-font glyphs as its first fallback. -->
<fontconfig>
  <alias binding="strong">
    <family>SF Pro</family>
    <prefer>
      <family>SF Pro</family>
      <family>Symbols Nerd Font Mono</family>
    </prefer>
  </alias>
</fontconfig>
