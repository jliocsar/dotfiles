<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- The fonts-opendyslexic .woff files have no family name, so fontconfig matches
     them for every family it's asked for (ghostty then fails with FontconfigNoMatch).
     The .otf copies of the same fonts are still available. -->
<fontconfig>
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/woff/opendyslexic/*</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
