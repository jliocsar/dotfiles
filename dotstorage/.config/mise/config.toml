[settings]
# update every non-pinned tool below once a day, on launch or at the shell prompt
tool_update.global_auto = true

[tools]
"github:backnotprop/plannotator" = { version = "latest", asset_pattern = "plannotator-linux-x64" }
"github:betterleaks/betterleaks" = { version = "latest", asset_pattern = "betterleaks_{{version}}_linux_x64.tar.gz" }
"github:dmtrKovalenko/fff" = { version = "latest", asset_pattern = "fff-mcp-x86_64-unknown-linux-gnu" }
"github:ente-io/ente" = { version = "latest", tag_regex = "^cli-v", version_prefix = "cli-v", asset_pattern = "ente-cli-v{{version}}-linux-amd64.tar.gz", github_attestations = false }
"github:jliocsar/pie" = { version = "latest", asset_pattern = "pie-linux-x64" }
"github:vercel-labs/agent-browser" = "latest"
"npm:@plannotator/tot" = "latest"
"npm:harkctl" = "latest"
"npm:hunkdiff" = "latest"
bun = "latest"
claude = "latest"
cmake = "latest"
flyctl = "latest"
herdr = "latest"
infisical = "latest"
lazydocker = "latest"
mermaid-ascii = "latest"
neovim = "latest"
node = "lts"
nub = "latest"
pi = "latest"
pnpm = "latest"
rust = "stable"
uv = "latest"
zoxide = "latest"
go = "latest"
"npm:@openai/codex" = "latest"
"npm:pake-cli" = "latest"
"npm:@anthropic-ai/sandbox-runtime" = "latest"
"npm:@tobilu/qmd" = "latest"
"npm:portless" = "latest"
"npm:typescript-language-server" = "latest"
"npm:uipro-cli" = "latest"
"npm:@beads/bd" = "latest"
"npm:yarn" = "latest"
"npm:@tigrisdata/cli" = { version = "latest", allow_low_downloads = true }
